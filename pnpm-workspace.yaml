packages:
  - packages/*
  - examples/*

# Only esbuild needs its install script (it fetches its platform binary).
allowBuilds:
  esbuild: true
  '@playwright/browser-chromium': false
  '@swc/core': false
  onnxruntime-node: false
  protobufjs: false

# Refuse to install on a Node older than package.json's engines (24+).
engineStrict: true
