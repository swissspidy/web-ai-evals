# Promptfoo eval that runs prompts inside a real browser via web-ai-evals.
# Run from examples/promptfoo:  npx promptfoo eval -c promptfooconfig.yaml
description: Sentiment with in-browser models

prompts:
  - "Classify the sentiment of this review as positive, negative or neutral. Reply with one word.\n\nReview: {{review}}"

providers:
  # Deterministic mock backend in Playwright's Chromium: works anywhere, used in CI.
  - id: file://node_modules/web-ai-evals/dist/promptfoo/provider.js
    label: mock
    config:
      browser: { id: chromium, channel: chromium, headless: true, proxy: false }
      backend: { kind: mock, options: { output: "positive" } }
  # Gemini Nano via the Prompt API in Google Chrome (needs a supported device).
  # - id: file://node_modules/web-ai-evals/dist/promptfoo/provider.js
  #   label: gemini-nano
  #   config:
  #     browser: chrome
  #     backend: { kind: prompt-api }

defaultTest:
  options:
    transform: output.trim().toLowerCase().replace(/[^a-z]/g, '')

tests:
  - vars: { review: "The battery easily lasts two full days and the screen is gorgeous." }
    assert:
      - { type: equals, value: positive }
      - { type: latency, threshold: 30000 }
  - vars: { review: "The zipper broke on the second day and the seller ignored my emails." }
    assert:
      - { type: equals, value: negative }
  - vars: { review: "The package arrived on Tuesday." }
    assert:
      - { type: equals, value: neutral }
