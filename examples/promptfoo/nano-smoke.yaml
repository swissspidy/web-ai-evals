# Gemini Nano through promptfoo on a CPU-only Linux machine (force-cpu preset).
description: Gemini Nano smoke test
prompts:
  - "Classify the sentiment of this review as positive, negative or neutral. Reply with one word.\n\nReview: {{review}}"
providers:
  - id: file://node_modules/web-ai-evals/dist/promptfoo/provider.js
    label: gemini-nano
    config:
      browser: { channel: chrome, presets: [force-cpu] }
      backend: { kind: prompt-api }
defaultTest:
  options:
    transform: output.trim().toLowerCase().replace(/[^a-z]/g, '')
  assert:
    - { type: latency, threshold: 10000 }
tests:
  - vars: { review: "Oh great, another update that makes the app slower. Just what I needed." }
    assert: [{ type: equals, value: negative }]
  - vars: { review: "Honestly? Worth every cent." }
    assert: [{ type: equals, value: positive }]
  - vars: { review: "The price went up by two euros this year." }
    assert: [{ type: equals, value: neutral }]
