name: Nightly built-in AI drift

# Runs on a self-hosted machine with a real GPU and Chrome Stable, Beta and
# Canary installed (see docs/self-hosted-runner.md). Profiles and history live
# on the runner so models are not re-downloaded and nights can be compared.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      channels:
        description: Comma-separated Chrome channels
        default: chrome,chrome-beta,chrome-canary

permissions:
  contents: read

concurrency:
  group: nightly-gpu
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: [self-hosted, gpu, web-ai-evals]
    timeout-minutes: 120
    env:
      WAE_CHANNELS: ${{ inputs.channels || 'chrome,chrome-beta,chrome-canary' }}
      WAE_HISTORY: ${{ vars.WAE_HISTORY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm from packageManager, Node from .node-version, and runs
      # the install itself (--frozen-lockfile, via require-lockfile).
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          require-lockfile: true
      - run: pnpm build
      - name: Run nightly suite and diff against the previous night
        id: nightly
        run: |
          history="${WAE_HISTORY:-$HOME/web-ai-evals-history}"
          pnpm wae nightly --config nightly.config.ts --history "$history" --fail-on-flags
      - name: Collect this run's files
        # Only files written by this run: if it failed before writing one, upload nothing
        # rather than a previous night's report.
        if: always() && steps.nightly.outputs.run-file != ''
        env:
          RUN_FILE: ${{ steps.nightly.outputs.run-file }}
        run: |
          mkdir -p nightly-out
          cp "${RUN_FILE%.json}".* nightly-out/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.nightly.outputs.run-file != ''
        with:
          name: nightly-${{ github.run_id }}
          path: nightly-out/
          retention-days: 30
