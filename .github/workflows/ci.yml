name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Smoke run (mock backend, headless Chromium)
        run: pnpm wae run --config examples/smoke.config.ts
      - name: Promptfoo provider (mock backend)
        working-directory: integrations/promptfoo
        run: npx promptfoo eval -c example/promptfooconfig.yaml --no-cache --no-write || test $? -eq 100
