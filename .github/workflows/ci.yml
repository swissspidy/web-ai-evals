name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Installs pnpm from packageManager, Node from .node-version, and runs
      # the install itself. require-lockfile makes that install --frozen-lockfile
      # and fails outright if the lockfile has gone missing.
      - uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint:publish
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - name: Smoke run (mock backend, headless Chromium)
        run: pnpm wae run --config examples/smoke.config.ts
      - name: Promptfoo provider (mock backend)
        working-directory: examples/promptfoo
        run: pnpm exec promptfoo eval -c promptfooconfig.yaml --no-cache --no-write || test $? -eq 100
